<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories Reader</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .story { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        @media (max-width: 600px) {
            .container { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stories Reader</h1>
        <div id="stories"></div>
        <button id="loadMore">Load More Stories</button>
    </div>
    <script>
        const stories = [
            { title: 'Story 1', content: 'This is the content of story 1.' },
            { title: 'Story 2', content: 'This is the content of story 2.' },
            { title: 'Story 3', content: 'This is the content of story 3.' },
            // Add more stories as needed
        ];
        let currentIndex = 0;
        const storiesContainer = document.getElementById('stories');
        const loadMoreButton = document.getElementById('loadMore');

        function loadStories() {
            for (let i = 0; i < 2 && currentIndex < stories.length; i++, currentIndex++) {
                const story = document.createElement('div');
                story.classList.add('story');
                story.innerHTML = `<h2>${stories[currentIndex].title}</h2><p>${stories[currentIndex].content}</p>`;
                storiesContainer.appendChild(story);
            }
            if (currentIndex >= stories.length) {
                loadMoreButton.style.display = 'none';
            }
            trackStoryView();
        }

        function trackStoryView() {
            const viewedStories = JSON.parse(localStorage.getItem('viewedStories')) || [];
            viewedStories.push(currentIndex);
            localStorage.setItem('viewedStories', JSON.stringify(viewedStories));
        }

        loadMoreButton.addEventListener('click', loadStories);
        loadStories();
    </script>
</body>
</html>
