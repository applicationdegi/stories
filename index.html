<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اردو رومانٹک کہانیاں</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .story {
            background: #fff;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .story {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>اردو رومانٹک کہانیاں</h1>
    <div class="story">
        <h2>پہلی کہانی</h2>
        <p>یہ ایک پیاری کہانی ہے جو محبت کے بارے میں ہے...</p>
    </div>
    <div class="story">
        <h2>دوسری کہانی</h2>
        <p>اس کہانی میں ایک نوجوان کی محبت کا سفر بیان کیا گیا ہے...</p>
    </div>
</body>
</html>
