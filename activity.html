<!DOCTYPE html>
<html>
<head>
  <title>Activity Logs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>User Activity Logs</h2>

<table>
  <thead>
    <tr>
      <th>Action</th>
      <th>Story</th>
      <th>Time</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody id="logs"></tbody>
</table>

<script>
  const logs = JSON.parse(localStorage.getItem("activityLogs")) || [];
  const table = document.getElementById("logs");

  logs.forEach(log => {
    table.innerHTML += `
      <tr>
        <td>${log.action}</td>
        <td>${log.story}</td>
        <td>${log.time}</td>
        <td>${log.details || "-"}</td>
      </tr>
    `;
  });
</script>

</body>
</html>
