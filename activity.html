<!DOCTYPE html>
<html>
<head>
  <title>Activity Logs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button onclick="exportLogs()">Download Logs (.txt)</button>
<h2>User Activity Logs</h2>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Action</th>
      <th>Story</th>
      <th>Time</th>
      <th>Details</th>
      <th>Device</th>
    </tr>
  </thead>
  <tbody id="logs"></tbody>
</table>

<script>
  const logs = JSON.parse(localStorage.getItem("activityLogs")) || [];
  const table = document.getElementById("logs");
  // Sort logs by most recent time
  logs.sort((a, b) => new Date(b.time) - new Date(a.time));

  logs.forEach(log => {
    const device = log.device
      ? `
        <strong>${log.device.deviceType}</strong><br>
        ${log.device.browser}<br>
        ${log.device.platform}<br>
        ${log.device.screenResolution}
      `
      : "-";

    table.innerHTML += `
      <tr>
        <td>${log.action}</td>
        <td>${log.story || "-"}</td>
        <td>${log.time}</td>
        <td>${log.details || "-"}</td>
        <td>${device}</td>
      </tr>
    `;
  });
</script>

</body>
</html>
